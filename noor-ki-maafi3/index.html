Suno.

3 din ho gaye. 3 din, 3 raatein, aur tumhari ek khamoshi ne mujhe sheher ka sabse akela insaan bana diya.

Main jaanta hoon maine galat kiya. Tumne ek shart rakhi thi — tumhari self-respect, tumhari boundary thi woh. Aur maine mana kar diya. Ek second ke liye laga shayad mazak hai. Lekin tumhare liye mazak nahi tha. Tumhara gussa jaiz tha. Maine tumhari baat ko halka liya, tumhare jazbaat ko nahi samjha. Uske liye dil se maafi.

Uske baad tumne call kaat di. Aur woh cut ab bhi mere kaano mein bajti hai. Main 2 din busy tha, sach. Lekin har free minute pe dekha — tum offline. Aur main... Peshawar ki sadkon pe ghoomta raha. Qissa Khwani se University Town tak. Sheher bhara hai Noor, lekin main akela hoon.

Tum... tum eldest daughter ho. Main dekhta hoon. Ghar ke kaam, daant, expectations — sab tumhare shoulders pe. You carry the whole house on your shoulders, let me carry your worries. Please.

Jab tum sad hoti ho, offline chali jaati ho. Main samajhta hoon. Main force nahi karunga. Main bas yahan rahunga. Main hoon na.

You are not your mistakes. You are the love you give. Tum woh ladki ho jo sabke liye roshni banti hai, chahe khud andhere mein ho. You bring light to my world, even when yours feels dark.

I can't hug you right now, so I'm sending you these words to hold you. 4500km hai Peshawar se Nairobi tak. Lekin Distance means so little when someone means so much. Hum same chaand dekhte hain, Noor. Same moon, different timezones.

Tum naraz achi nahi lagti. Tum hasti hui achi lagti ho. Tumhari woh Caveat wali handwriting jaisi smile.

Toh maaf kar do na? Chal ab smile kar do? 3 din bohat hain.

Tumhara,
Ishaq
